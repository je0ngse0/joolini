spring.application.name=joolini
spring.threads.virtual.enabled=true
joolini.simulation.tick-rate-ms=2000
joolini.kis.enabled=${KIS_ENABLED:false}
joolini.kis.base-url=${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
joolini.kis.app-key=${KIS_APP_KEY:}
joolini.kis.app-secret=${KIS_APP_SECRET:}
joolini.kis.poll-rate-ms=${KIS_POLL_RATE_MS:15000}
joolini.kis.request-interval-ms=${KIS_REQUEST_INTERVAL_MS:700}
